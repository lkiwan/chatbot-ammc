services:
  postgres:
    image: postgres:16-alpine
    container_name: ammc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ammc_finance}
      POSTGRES_USER: ${POSTGRES_USER:-ammc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ammc_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ammc} -d ${POSTGRES_DB:-ammc_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
