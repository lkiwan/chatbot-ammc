services:
  postgres:
    image: postgres:16-alpine
    container_name: ammc_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ammc_finance}
      POSTGRES_USER: ${POSTGRES_USER:-ammc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ammc} -d ${POSTGRES_DB:-ammc_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ammc_prod_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ammc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ammc_finance}
      WATCH_ENABLED: "false"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./data:/app/data
      - ./.chroma:/app/.chroma
      - ./ammc_report_scraper/data:/app/ammc_report_scraper/data
      - model_cache:/root/.cache/chroma
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
    driver: local
  model_cache:
    driver: local
